name: Android Release

on:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Validate version and install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#android-v}"
          grep -F "versionName '$version'" apps/android/app/build.gradle
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Test native engine
        run: cargo test -p qingjian-android --locked
      - name: Build and lint APK
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Verify and prepare installation package
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$apk"
          mkdir -p dist
          cp "$apk" "dist/qingjian-android-${GITHUB_REF_NAME#android-v}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS
      - name: Publish Android prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/android-release-notes.md <<'NOTES'
          青简 Android 首个可安装基础版（开发签名 / 预发布）。

          - Android 8.0 及以上，支持 ARM64 和 x86_64；下载下方 APK 安装。
          - 安装后打开「青简」，按提示启用并切换输入法。
          - 支持离线拼音、简拼、纠错、词频整句、英文译词、候选上屏和本地学习。
          - 不申请网络权限；尚未接入云联想、神经模型、语音和主题设置。
          - 已通过 Rust 测试、Android Lint 和 API 26 x86_64 模拟器验证；ARM64 真机与真实 16 KiB 页设备尚未验证。

          此 APK 使用开发签名，仅供基础版体验；后续改用正式签名时可能需要卸载后安装，卸载会删除本地学习数据。
          SHA256SUMS 提供安装包校验值。
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "青简 Android ${GITHUB_REF_NAME#android-v}" \
            --notes-file /tmp/android-release-notes.md
